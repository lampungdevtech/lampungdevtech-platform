version: '3.8'

services:
  # 1. Relational Database untuk Orders, Shift Ledger, Branches & CapEx (dengan pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pos_postgres
    restart: always
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
      POSTGRES_DB: pos_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  # 2. Document Database untuk Event Management & Menu Catalogs
  mongodb:
    image: mongo:7.0
    container_name: pos_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: lampungdevtech
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  # 3. Redis untuk Hot Caching, Table Locks, dan Idempotency Dedup
  redis:
    image: redis:7-alpine
    container_name: pos_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # 4. RabbitMQ untuk Asynchronous Event Bus & Notifications
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pos_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'   # AMQP protocol
      - '15672:15672' # Management Web Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # 5. OpenTelemetry / Jaeger Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pos_jaeger
    ports:
      - '16686:16686' # Web UI
      - '4318:4318'   # OTLP HTTP receiver

  # 6. Prometheus Metrics Server
  prometheus:
    image: prom/prometheus:latest
    container_name: pos_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  # 7. Python AI & ML Engine Microservice (FastAPI + LangChain + gRPC)
  ai-engine:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: pos_ai_engine
    restart: always
    environment:
      - APP_ENV=development
      - PORT=8000
      - GRPC_PORT=50051
      - DATABASE_URL=postgres://pos_user:pos_password@postgres:5432/pos_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - '8000:8000'   # FastAPI REST Swagger / OpenAPI Docs
      - '50051:50051' # Internal gRPC Port
    depends_on:
      - postgres
      - redis
      - rabbitmq

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
