apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-order-service
  namespace: lampungdev-pos
  labels:
    app: pos-order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pos-order-service
  template:
    metadata:
      labels:
        app: pos-order-service
    spec:
      containers:
      - name: order-service
        image: registry.lampungdevtech.com/pos-order-service:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50051
          name: grpc
        envFrom:
        - configMapRef:
            name: pos-common-config
        - secretRef:
            name: pos-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pos-order-service
  namespace: lampungdev-pos
spec:
  type: ClusterIP
  selector:
    app: pos-order-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 50051
    targetPort: 50051
---
# Horizontal Pod Autoscaler (Otomatis menambah pod saat jam makan siang/malam kafe)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pos-order-hpa
  namespace: lampungdev-pos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pos-order-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
